      background: #f9f9f9;

      color: #333;
    }
    header {
      background: #24292e;
      color: #fff;
      padding: 2rem 1rem 1rem 1rem;
      text-align: center;
    }
    main {
      max-width: 700px;
      margin: 2rem auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);

    h1 {
      margin-top: 0;
    }
    a {
      color: #2e7efb;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    footer {
      text-align: center;
      padding: 1.5rem 0 1rem 0;

      This is a sample website hosted using <strong>GitHub Pages</strong>.
